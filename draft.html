<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troop 2019 Eagle Scouts</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Flex container to place patch and medal side-by-side */
        .insignia-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem; /* Spacing between the patch and medal */
            margin-top: 1.5rem;
        }

        .insignia-img {
            height: 200px; /*110px; /* Constrains height so both items look proportional together */
            width: auto;
            max-width: 100%;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.3)); /* Drop shadow to pop from navy */
        }
    </style>
</head>
<body>
    <header>
        <h1>Troop 2019 Eagle Scouts</h1>
        <p>Celebrating excellence and leadership</p>
        
        <!-- Insignia Visual Display Block -->
        <div class="insignia-container">
            <img src="./eagle-patch.png" alt="Eagle Scout Rank Patch" class="insignia-img">
            <img src="./eagle-medal.png" alt="Eagle Scout Award Medal" class="insignia-img">
        </div>
    </header>
  
    <div class="container">
        <div class="card">
            <p>Lisa A. Hahn</p>
            <p>May 19, 2026</p>
            <p>Teagan M. Dixon</p>
            <p>June 24, 2025</p>
            <p>Shirley L. Stockwell</p>
            <p>March 6, 2023</p>
        </div>
    </div>

    <footer>
        <p>Once an Eagle, Always an Eagle.</p>
    </footer>
</body>
</html>
