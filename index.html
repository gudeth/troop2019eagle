<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Troop 2019 Eagle Scouts</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; /* Aligns items to the top instead of spreading them out */
            align-items: center;
            text-align: center;
            padding: 20px;
            gap: 2rem;                    /* Adds clean spacing between header, container, and footer */
        }
        .container {
            max-width: 600px;
            width: 100%;
        }
        footer {
            margin-top: auto;             /* Pushes the footer down to the very bottom of the page */
            text-align: center;
            padding: 2rem;
        }
        /* Add this to target the text inside the footer specifically */
        footer p {
            font-size: 0.9rem;
            margin-bottom: 0; /* Also cleans up extra bottom spacing */
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .card {
            margin-top: 4rem; /* Adjust this value (e.g., 2rem, 3rem, 4rem, 50px) to set the exact offset */
            background: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .scout-entry {
            margin-bottom: 1.25rem;
        }
        
        .scout-entry:last-child {
            margin-bottom: 0;
        }
        
        .scout-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f8fafc;
        }
        
        .scout-date {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-top: 0.2rem; /* Keeps the date tight right below the name */
        }

        /* Flex container to place patch and medal side-by-side */
        .insignia-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem; /* Spacing between the patch and medal */
            margin-top: 1.5rem;
        }

        .insignia-img {
            height: 200px; /*110px; /* Constrains height so both items look proportional together */
            width: auto;
            max-width: 100%;
            filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.3)); /* Drop shadow to pop from navy */
        }

        .website-link {
            color: #38bdf8;             /* Matches your title gradient color */
            text-decoration: none;
            font-weight: 600;
            margin-top: 1.5rem;         /* Space between the card and the link */
            transition: color 0.2s ease;
        }
        
        .website-link:hover {
            color: #818cf8;             /* Lightens on hover */
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Troop 2019 Eagle Scouts</h1>
        <p>Celebrating excellence and leadership</p>
        
        <!-- Insignia Visual Display Block -->
        <div class="insignia-container">
            <img src="./eagle-patch.png" alt="Eagle Scout Rank Patch" class="insignia-img">
            <img src="./eagle-medal.png" alt="Eagle Scout Award Medal" class="insignia-img">
        </div>
    </header>
  
    <div class="card">
        <div class="scout-entry">
            <div class="scout-name">Lisa A. Hahn</div>
            <div class="scout-date">May 19, 2026</div>
        </div>
        <div class="scout-entry">
            <div class="scout-name">Teagan M. Dixon</div>
            <div class="scout-date">June 24, 2025</div>
        </div>
        <div class="scout-entry">
            <div class="scout-name">Shirley L. Stockwell</div>
            <div class="scout-date">March 6, 2023</div>
        </div>
    </div>

    <!-- Link added directly under the card -->
    <a href="https://www.troopwebhost.org/Troop2019Huntley/" target="_blank" rel="noopener noreferrer" class="website-link">
        Visit troop2019.org
    </a>

    <footer>
        <p>Once an Eagle, Always an Eagle.</p>
    </footer>
</body>
</html>
